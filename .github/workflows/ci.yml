name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PediatR.sln

      - name: Build
        run: dotnet build PediatR.sln -c Release --no-restore

      # Runs the xUnit suite on every target framework (net8.0, net9.0, net10.0).
      - name: Test
        run: dotnet test PediatR.sln -c Release --no-build --verbosity normal
